[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-platform"
version = "0.1.0"
description = "Vendor-neutral enterprise agent evaluation harness and AI ROI platform"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Enterprise AI Platform contributors"}]
classifiers = ["Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12"]
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6", "pydantic-settings>=2.2", "httpx>=0.27", "sqlmodel>=0.0.16", "pyyaml>=6", "jsonschema>=4.21", "python-dotenv>=1", "streamlit>=1.32", "plotly>=5.19", "requests>=2.31", "pandas>=2.2", "pyarrow>=14,<20"]

[project.scripts]
agenteval = "app.agent_eval.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.3", "black>=24", "coverage>=7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["app*"]
